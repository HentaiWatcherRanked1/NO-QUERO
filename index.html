<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Convoy" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=3" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <title>Convoy</title>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <section class="top-card glass">
      <div>
        <div class="eyebrow">LIVE CONVOY</div>
        <div class="title" id="convoyName">Night Run</div>
      </div>
      <div class="stats">
        <div><strong id="carCount">3 cars</strong></div>
        <div id="spread">0.0 mi spread</div>
      </div>
    </section>

    <div class="map-actions">
      <button id="centerBtn" class="round-btn" aria-label="Center on me">◎</button>
      <button id="editBtn" class="round-btn" aria-label="Edit map">✎</button>
      <button id="iconModeBtn" class="round-btn" aria-label="Toggle marker style">🚗</button>
    </div>

    <div id="editBanner" class="edit-banner glass hidden">
      EDIT MODE — drag cars/spots or tap map
    </div>

    <section id="convoyPanel" class="convoy-panel glass">
      <div>
        <div class="eyebrow">INVITE CODE</div>
        <div id="inviteCode" class="invite-code">GTI629</div>
      </div>

      <button id="gpsBtn" class="secondary">USE MY GPS</button>
      <button id="toggleBtn" class="danger">END</button>
    </section>

    <nav class="bottom-nav glass">
      <button data-tab="drive" class="active">🚗<span>DRIVES</span></button>
      <button data-tab="crew">👥<span>CREW</span></button>
      <button data-tab="stats">▥<span>STATS</span></button>
      <button data-tab="map">🗺️<span>MAP</span></button>
    </nav>

    <section id="drivePanel" class="mode-panel glass">
      <div class="panel-title-row">
        <div>
          <div class="eyebrow">DRIVES</div>
          <div class="section-title">Recent runs</div>
        </div>
        <div class="filter-chips">
          <button class="chip active">Recent</button>
          <button class="chip">Fastest</button>
          <button class="chip">Longest</button>
        </div>
      </div>
      <div id="driveList"></div>
    </section>

    <section id="statsPanel" class="mode-panel glass hidden">
      <div class="panel-title-row">
        <div>
          <div class="eyebrow">COMPARISON</div>
          <div class="section-title">Drive stats</div>
        </div>
      </div>
      <div id="statsContent"></div>
    </section>

    <div id="hazardToast" class="hazard-toast glass hidden">
      <div class="hazard-icon">⚠️</div>
      <div>
        <strong id="hazardTitle">Road issue ahead</strong>
        <small id="hazardSub">0.4 mi ahead</small>
      </div>
    </div>

    <section id="drawer" class="drawer glass hidden">
      <div class="drawer-head">
        <strong id="drawerTitle">Menu</strong>
        <button id="closeDrawer">✕</button>
      </div>
      <div id="drawerContent"></div>
    </section>

    <section id="sheet" class="sheet glass hidden">
      <div class="drawer-head">
        <strong id="sheetTitle">Add item</strong>
        <button id="closeSheet">✕</button>
      </div>
      <div id="sheetContent"></div>
    </section>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js?v=3"></script>
</body>
</html>
