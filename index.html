<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Convoy" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=2" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <title>Convoy</title>
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <section class="top-card glass">
      <div>
        <div class="eyebrow">LIVE CONVOY</div>
        <div class="title">Night Run</div>
      </div>
      <div class="stats">
        <div><strong id="carCount">3 cars</strong></div>
        <div id="spread">1.1 mi spread</div>
      </div>
    </section>

    <button id="centerBtn" class="floating-btn" aria-label="Center map">◎</button>

    <section id="convoyPanel" class="convoy-panel glass">
      <div>
        <div class="eyebrow">INVITE CODE</div>
        <div id="inviteCode" class="invite-code">GTI629</div>
      </div>

      <button id="gpsBtn" class="secondary">USE MY GPS</button>
      <button id="toggleBtn" class="danger">END</button>
    </section>

    <nav class="bottom-nav glass">
      <button data-tab="map">MAP</button>
      <button data-tab="routes">ROUTES</button>
      <button data-tab="spots">SPOTS</button>
      <button data-tab="convoy" class="active">CONVOY</button>
    </nav>

    <section id="drawer" class="drawer glass hidden">
      <div class="drawer-head">
        <strong id="drawerTitle">Routes</strong>
        <button id="closeDrawer">✕</button>
      </div>
      <div id="drawerContent"></div>
    </section>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js?v=2"></script>
</body>
</html>
